<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>doors to mirrors</title>
    <link rel="icon" href="favicon.ico" />
    <style>
      :root {
        --frame-height: 650px;
        --frame-width: 325px;
        --frame-border: 4px; /* this is 2px border x 2 */
        --body-margin: 8px;
        --frame-total-width: calc(var(--frame-width) + var(--frame-border));
        --frame-space-between: calc((100vw - 2 * var(--frame-total-width)) / 3);
        --frame-min-margin: 2rem;
        --exit-height: 100px;
        --exit-width: 125px;
      }

      html {
        background-color: rgb(16, 16, 67);
      }

      body {
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
        justify-content: space-evenly;
        text-align: center;
      }

      iframe.door-frame {
        margin-top: max(var(--frame-min-margin), calc(50vh - var(--frame-height) / 2));
        height: var(--frame-height);
        width: var(--frame-width);
      }

      .shadow {
        --frame-plus-body: calc(var(--frame-total-width) + var(--body-margin));
        --min-top-margin: calc(var(--frame-min-margin) + var(--frame-plus-body));
        background-color: #2929b4;
        filter: blur(3px);
        height: 400px;
        margin: 0;
        position: absolute;
        top: max(var(--min-top-margin), calc(50vh + var(--frame-plus-body)));
        width: var(--frame-width);
        z-index: -1;
      }
      
      .shadow-left {
        left: max(var(--body-margin), var(--frame-space-between));
        /* translate x is purely hardcoded atm */
        transform: translateX(-73px) skewX(340deg);
      }

      .shadow-right {
        /* genuinely stumped by the 319px, which should be 329px */
        --fluid-left: calc(var(--frame-space-between) * 2 + 319px);
        left: max(293px, var(--fluid-left));
        transform: translateX(73px) skewX(20deg);
      }

      .door-frame + .door-frame {
        margin-left: 2rem;
      }

      .door-exit {
        left: 89vw; /* just out of view */
        padding: 32px;
        position: absolute;
        top: 0;
        height: calc(var(--exit-height) + var(--frame-border));
        width: calc(var(--exit-width) + var(--frame-border));;
      }
      
      .exit-frame {
        height: var(--exit-height);
        width: var(--exit-width);
      }

      /* TODO: This might need to be scaled for mobile */
      .verification {
        border: unset;
        border-radius: 10px;
        height: 285px;
        max-width: unset; /* prevent the dialog from collapsing on small window sizes */
        overflow: hidden;
        padding: 0;
        width: 445px;

        /* position the dialog next to the exit sign */
        margin: 0;
        position: absolute;
        top: 15px;
        left: max(15px, calc(89vw - 445px));
      }

      .verification::backdrop {
        background: rgba(0, 0, 0, 0.3);
      }

      .verification > iframe {
        border: unset;
        height: 100%;
        margin: 0 auto;
        width: 100%;
      }

      .mobile {
        display: none;
      }

      .banner {
        background-color: #2929b4;
        box-sizing: border-box;
        color: white;
        left: 0;
        padding: 1rem;
        position: fixed;
        top: 0;
        width: 100%;
      }

      @media screen and (max-width: 600px) {
        .mobile {
          display: block;
        }
      }

    </style>
    <script>
      const MOUSE_TRACE = "MouseTrace"
      const MOUSE_MOVE = "MouseMove"
      const MOUSE_ENTER = "MouseEnter"
      const MOUSE_LEAVE = "MouseLeave"
      const GHOST_APPEAR = "GhostAppear"
      const GHOST_EVADE = "GhostEvade"
      const EXIT = "DoorExit"
      const VERIFIED = "CaptchaVerified"

      function verify(event, receivers) {
        if (!event || event.origin !== window.origin) {
          return false
        }

        if (!event.data || !event.data.type) {
          return false
        }

        const { data, source } = event
        const { type } = data

        switch (type) {
          case MOUSE_LEAVE:
          case MOUSE_ENTER:
            const receiver = source ? receivers[source.name] : undefined
            return !!receiver
          case GHOST_APPEAR:
          case GHOST_EVADE:
          case MOUSE_TRACE:
          case MOUSE_MOVE:
            const receiverFound = source ? receivers[source.name] : undefined
            const xIsNumber = Number.isFinite(data.x)
            const yIsNumber = Number.isFinite(data.y)
            return !!receiverFound && xIsNumber && yIsNumber
          case EXIT:
          case VERIFIED:
            return true
        }

        return false
      }

      function send(receiver, payload) {
        receiver.contentWindow.postMessage(payload)
      }

      function test() {
        const dialog = document.getElementById("verification")
        if (dialog) {
          dialog.showModal()
        }
      }

      function exit() {
        const dialog = document.getElementById("verification")
        if (dialog) {
          dialog.close()
        }

        setTimeout(() => {
          // TODO: Play around with a transition animation
          window.location.assign("to-doors")
        }, 250)
      }

      document.addEventListener("DOMContentLoaded", () => {
        const frameOne = document.getElementById("one")
        const frameTwo = document.getElementById("two")

        const sourceToReceiver = {
          one: frameTwo,
          two: frameOne,
        }

        window.addEventListener("message", (e) => {
          if (!verify(e, sourceToReceiver)) {
            return
          }

          switch(e.data.type) {
            // Mouse events are proxied from one window to another
            case GHOST_APPEAR:
            case GHOST_EVADE:
            case MOUSE_MOVE:
            case MOUSE_TRACE:
              const coordReceiver = sourceToReceiver[e.source.name]
              send(coordReceiver, { type: e.data.type, x: e.data.x, y: e.data.y })
              return
            case MOUSE_ENTER:
            case MOUSE_LEAVE:
              const eventReceiver = sourceToReceiver[e.source.name]
              send(eventReceiver, { type: e.data.type })
              return
            // Verification events are processed from child windows
            case EXIT:
              test()
              return
            case VERIFIED:
              exit()
              return
          }
        })
      })

    </script>
  </head>
  <body>
    <aside class="banner mobile"><em>psst</em>, this site is built with computer mice in mind and is best viewed on a desktop browser</aside>
    <iframe id="one" name="one" class="door-frame" title="door frame to mirror" src="doorways/mirror.html"></iframe>
    <figure class="shadow shadow-left" role="presentation"></figure>
    <iframe id="two" name="two" class="door-frame" title="door frame to mirror" src="doorways/mirror.html"></iframe>
    <figure class="shadow shadow-right" role="presentation"></figure>
    <section class="door-exit">
      <iframe id="next" name="exit" class="exit-frame" title="exit" src="doorways/exit.html"></iframe>
      <dialog id="verification" class="verification">
        <iframe name="exit-verification" src="doorways/text.html"></iframe>
      </dialog>
    </section>
    <!-- the last scene of this collection falls asleep when it's not viewed; this helps wake it up early -->
    <iframe src="https://doors-to-doors.onrender.com" aria-hidden="true" style="display: hidden; position: absolute; top: -100vh; left: -100vw;"></iframe>
  </body>
</html>
