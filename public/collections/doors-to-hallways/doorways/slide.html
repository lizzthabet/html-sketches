<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Please verify</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }

      .wrapper {
        height: 650px;
        width: 750px;
        margin: 0 auto;
      }

      .instruction-container {
        color: #5a5a5a;
        margin-bottom: 15px;
        text-align: center;
      }

      .instruction {
        font-size: 1.125rem;
        font-weight: bold;
      }

      .puzzle-wrapper {
        display: flex;
        flex-wrap: nowrap;
        height: 460px;
        margin: 0;
        min-width: 700px;
        padding: 0;
        width: 100%;
        justify-content: space-between;
      }

      .puzzle-pieces {
        background-image:
          linear-gradient(rgb(255, 255, 255, 0.5),rgba(255, 255, 255, 0.5)),
          url("../assets/pixel-background.png");
        border: 1px solid rgba(0, 0, 0, 0.75);
        height: 100%;
        margin: 0;
        padding: 0;
        width: 100%;
      }

      .hidden {
        display: none;
      }

      .puzzle-piece {
        z-index: 2;
      }

      .puzzle-piece.current {
        z-index: 3;
      }

      .piece-placeholder {
        opacity: 0.95;
        z-index: 1;
      }

      .slider {
        background-color: transparent;
        -webkit-appearance: none;
      }


      .slider-vertical {
        margin: 0 0 0 20px;
      }

      .slider-rotate {
        margin: 0 20px 0 0;
      }

      .slider-horizontal {
        margin: 20px 0 0 0;
        width: 100%;
      }

      .slider-rotate,
      .slider-vertical {
        height: 100%;
        writing-mode: vertical-lr;
        width: 32px;
      }

      .slider:focus {
        outline: none;
      }

      .slider::-webkit-slider-runnable-track {
        background: #eeeeee;
        border: 1px solid black;
        border-radius: 15px;
        width: 100%;
        height: 32px;
        cursor: pointer;
      }

      .slider::-moz-range-track {
        background: #eeeeee;
        border: 1px solid black;
        border-radius: 15px;
        width: 100%;
        cursor: pointer;
      }

      .slider.slider-horizontal::-moz-range-track {
        height: 32px;
      }

      .slider.slider-rotate::-moz-range-track,
      .slider.slider-vertical::-moz-range-track {
        width: 30px;
      }

      .slider:focus::-webkit-slider-runnable-track {
        background: #dddddd;
      }

      .slider.slider-horizontal::-webkit-slider-thumb {
        background-image: url('../assets/arrow-horizontal.png');
      }

      .slider.slider-rotate::-webkit-slider-thumb {
        background-image: url('../assets/arrow-rotate.png');
      }

      .slider.slider-vertical::-webkit-slider-thumb {
        background-image: url('../assets/arrow-vertical.png');
      }

      .slider::-webkit-slider-thumb {
        background-size: contain;
        background-repeat: no-repeat;
        cursor: pointer;
        height: 30px;
        width: 30px;
        -webkit-appearance: none;
      }

      .slider::-moz-range-thumb {
        background-color: transparent;
        background-size: contain;
        background-repeat: no-repeat;
        border: 1px transparent solid;
        cursor: pointer;
        height: 30px;
        width: 30px;
      }

      .slider.slider-horizontal::-moz-range-thumb {
        background-image: url('../assets/arrow-horizontal.png');
      }

      .slider.slider-rotate::-moz-range-thumb,
      .slider.slider-vertical::-moz-range-thumb {
        background-image: url('../assets/arrow-vertical.png');
      }

      .verify-button {
        background-color: #56ad48;
        border: none;
        border-radius: 2px;
        color: white;
        cursor: pointer;
        font-size: 1.125rem;
        padding: 10px 10px;
        display: block;
        margin: 35px 0 0 auto;
        width: 100px;
      }

      .verify-button:disabled {
        background-color: #5a5a5a;
        opacity: 0.5;
        cursor: not-allowed;
      }

      .verify-loading {
        animation-name: rotating;
        animation-duration: 3s;
        animation-iteration-count: infinite;
        animation-timing-function: linear;
        height: 20px;
        width: 20px;
      }

      @keyframes rotating {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      /**
       * @typedef {"left"|"right"|"top"|"bottom"|"rotate"} DirectionString
       * @typedef {(DirectionString|DirectionString[])} Direction
       * 
       * @typedef {Object} CoordinatesWithRotate
       * @property {number} x
       * @property {number} y
       * @property {number|undefined} rotate
       * 
       * @typedef {Object} Coordinates
       * @property {number} x
       * @property {number} y
       * 
       * @typedef {Object} Piece
       * @property {Coordinates} target
       * @property {CoordinatesWithRotate} initial
       * @property {Direction} direction
       * @property {number|undefined} delay
       * @property {boolean|undefined} drift
       * 
       * @typedef {Object.<string, Piece>} Pieces
       * 
       * @typedef {Object} Queue
       * @property {string[]} queue
       * 
       */

      // Constants
      const POSITION_BUFFER_PX = 5
      const POSITION_BUFFER_DEG = 10
      const SLIDER_STEP = 5
      const SLIDER_MAX = 500
      const INITIAL_X_MIN = 100
      const INITIAL_X_MAX = 600
      const INITIAL_Y_MIN = 90
      const INITIAL_Y_MAX = 440
      const SHOW_NEXT_DELAY = 250
      const PUZZLE_CONFIG = {
        "24": {
          "target": { "x":279, "y":276 },
          "direction": "left"
        },
        "20": {
          "target": { "x":342, "y":340 },
          "direction": "left",
          "delay": 4000
        },
        "3": {
          "target": { "x":455, "y":290.5 },
          "direction": "right",
          "delay": 3000
        },
        "21": {
          "target": { "x":264.5, "y":226 },
          "direction": "left",
          "delay": 2000
        },
        "16": {
          "target": { "x":228.5, "y":290 },
          "direction": "left",
          "delay": 1000
        },
        "23": {
          "target": { "x":391, "y":226 },
          "direction": "right"
        },
        "6": {
          "target": { "x":405, "y":165.5 },
          "direction": "left"
        },
        "5": {
          "target": { "x":331, "y":182.5 },
          "direction": "right"
        },
        "25": {
          "target": { "x":406, "y":276 },
          "direction": "right"
        },
        "10": {
          "target": { "x":242, "y":146 },
          "direction": ["left", "bottom"]
        },
        "11": {
          "target": { "x":236, "y":162.5 },
          "direction": ["right", "top"]
        },
        "17": {
          "target": { "x":228.5, "y":212 },
          "direction": ["right", "bottom"]
        },
        "9": {
          "target": { "x":278, "y":166 },
          "direction": ["left", "bottom"]
        },
        "12": {
          "target": { "x":406, "y":404 },
          "direction": ["left", "bottom"]
        },
        "19": {
          "target": { "x":266, "y":354 },
          "direction": ["right", "bottom"]
        },
        "14": {
          "target": { "x":301.5, "y":403 },
          "direction": ["right", "top"]
        },
        "13": {
          "target": { "x":328.5, "y":418 },
          "direction": ["left", "top", "rotate"]
        },
        "15": {
          "target": { "x":242, "y":340 },
          "direction": ["right", "top", "rotate"]
        },
        "1": {
          "target": { "x":469, "y":340 },
          "direction": ["left", "bottom", "rotate"]
        },
        "4": {
          "target": { "x":445, "y":152 },
          "direction": ["right", "bottom", "rotate"]
        },
        "2": {
          "target": { "x":469.5, "y":229.5 },
          "direction": ["left", "bottom", "rotate"]
        },
        "8": {
          "target": { "x":469, "y":116 },
          "direction": ["right", "bottom"],
          "drift": true
        },
        "7": {
          "target": { "x":455, "y":163 },
          "direction": ["left", "top", "rotate"],
          "drift": true
        },
        "22": {
          "target": { "x":342, "y":212 },
          "direction": ["right", "top", "rotate"],
          "drift": true
        },
        "18": {
          "target": { "x":391.5, "y":354 },
          "direction": ["left", "bottom", "rotate"],
          "drift": true
        },
        "26": {
          "target": { "x":328, "y":290 },
          "direction": ["left", "top", "rotate"],
          "drift": true
        }
      }

      /** 
       * @param {HTMLElement} element
       * @return {Coordinates} position
       */
      function getStylePosition(element) {
        if (!element) {
          return { x: 0, y: 0 }
        }

        const x = parseInt(element.style.getPropertyValue("left").replace("px", ""))
        const y = parseInt(element.style.getPropertyValue("top").replace("px", ""))

        return { x, y }
      }

      /**
       * @param {HTMLElement} element
       * @param {string} className
       * @param {boolean} addClass
       */
      function toggleClass(element, className, addClass) {
        if (!element) {
          return
        }

        if (addClass) {
          element.classList.add(className)
        } else {
          element.classList.remove(className)
        }
      }

      /**
       * @param {HTMLElement} element
       * @param {boolean} show
       */
      function showElement(element, show) {
        toggleClass(element, "hidden", !show)
      }

      /** 
       * @param {HTMLElement} element
       * @param {number} x
       * @param {number} y
       */
      function positionElement(element, x, y) {
        if (!element) {
          return
        }
        if (x !== undefined) {
          element.style.setProperty("left", x + "px")
        }
        if (y !== undefined) {
          element.style.setProperty("top", y + "px")
        }
      }

      /** 
       * @param {HTMLElement} element
       * @param {number} degrees
       */
       function rotateElement(element, degrees) {
        if (!element) {
          return
        }
        if (degrees !== undefined) {
          element.style.setProperty("rotate", degrees + "deg")
        }
      }

      /** @param {string} id */
      function showPieceAndTarget(id) {
        const p = document.getElementById(id)
        showElement(p, true)
        toggleClass(p, "current", true)
        const target = document.getElementById(`target_${id}`)
        showElement(target, true)
      }

      /** @param {boolean} show */
      function showVerifyLoading(show) {
        const verifyText = document.getElementById("verify-text")
        const verifyLoading = document.getElementById("verify-loading")
        if (show) {
          showElement(verifyText, false)
          showElement(verifyLoading, true)
        } else {
          showElement(verifyText, true)
          showElement(verifyLoading, false)
        }
      }

      /**
       * @param {string|string[]} direction
       * @return {"left"|"right"|undefined}
       */
       function horizontalDirection(direction) {
        if (Array.isArray(direction)) {
          if (direction.includes("left")) {
            return "left"
          }
          if (direction.includes("right")) {
            return "right"
          }

          return undefined
        }

        return (direction === "left" || direction === "right") ? direction : undefined
      }

      /**
       * @param {string|string[]} direction
       * @return {"top"|"bottom"|undefined}
       */
       function verticalDirection(direction) {
        if (Array.isArray(direction)) {
          if (direction.includes("top")) {
            return "top"
          }
          if (direction.includes("bottom")) {
            return "bottom"
          }

          return undefined
        }

        return (direction === "top" || direction === "bottom") ? direction : undefined
      }

      /**
       * @param {string|string[]} direction
       * @return {"rotate"|undefined}
       */
       function rotateDirection(direction) {
        if (Array.isArray(direction)) {
          if (direction.includes("rotate")) {
            return "rotate"
          }

          return undefined
        }

        return direction === "rotate"  ? direction : undefined
      }

      /** 
       * @param {string} pieceId
       */
      function checkPiecePosition(pieceId) {
        const piece = document.getElementById(pieceId)
        const config = pieces[pieceId]
        if (piece && config) {
          const targetX = config.target.x
          const targetY = config.target.y
          const { x, y } = getStylePosition(piece)
          const xInRange =  x >= targetX - POSITION_BUFFER_PX &&  x <= targetX + POSITION_BUFFER_PX
          const yInRange =  y >= targetY - POSITION_BUFFER_PX &&  y <= targetY + POSITION_BUFFER_PX

          let rotationInRange = true
          let rotation = 0
          const cssRotation = piece.style.getPropertyValue("rotate")
          if (cssRotation && cssRotation.length) {
            rotation = parseInt(cssRotation.replace("deg", "")) % 360
            // Allow pieces to be right side up or upside down
            const rightSideUpInRange = rotation >= 0 && rotation <= 0 + POSITION_BUFFER_DEG
            const upsideDownInRange = rotation >= 180 - POSITION_BUFFER_DEG && rotation <= 180 + POSITION_BUFFER_DEG 
            if (!rightSideUpInRange && !upsideDownInRange) {
              rotationInRange = false
            }
          }

          // Check to see if piece is in the right area
          if (xInRange && yInRange && rotationInRange) {
            // Stop any drift animations
            stopDrift()
            // "Snap" piece into place
            positionElement(piece, targetX, targetY)
            const closestDeg = (rotation <= 90 || rotation > 270) ? 0 : 180
            rotateElement(piece, closestDeg)
            // Remove "current" class (used to layer piece above others)
            toggleClass(piece, "current", false)
            // Hide the target piece since it's no longer needed
            const target = document.getElementById(`target_${pieceId}`)
            showElement(target, false)
            // Grab the next piece
            selectedId = queue.shift()
            if (selectedId) {
              const pieceConfig = pieces[selectedId]
              const delay = pieceConfig.delay ?? SHOW_NEXT_DELAY
              // TODO: Consider disabling sliders while loading
              // Show a loading animation when delay is greater than default
              if (delay > SHOW_NEXT_DELAY) {
                showVerifyLoading(true)
              }
              setTimeout(() => {
                // Reset loading state
                showVerifyLoading(false)
                // Display pieces
                showPieceAndTarget(selectedId)
                // Configure the next slider
                configureSliderToPiece(selectedId)
              }, delay)
            }
          }
        }

        // Queue is empty so all pieces must be in the right place
        if (!selectedId && queue.length === 0) {
          const submitButton = document.getElementById("verify")
          if (submitButton) {
            submitButton.removeAttribute("disabled")
          }
        }
      }

      /**
       * @param {Event} e
       * @param {string} pieceId
       */
      function onSliderChange(e, pieceId) {
        return checkPiecePosition(pieceId)
      }

      /**
       * @param {InputEvent} e
       * @param {string} pieceId
       * @param {"horizontal"|"vertical"|"rotate"} change
       */
      function onSliderInput(e, pieceId, change) {
        const piece = document.getElementById(pieceId)
        const config = pieces[pieceId]
        if (!piece || !config) {
          return
        }

        if (change === "horizontal") {
          const newX = config.initial.x + e.target.valueAsNumber
          positionElement(piece, newX, undefined)
        } else if (change === "vertical") {
          const newY = config.initial.y + e.target.valueAsNumber
          positionElement(piece, undefined, newY)
        } else if (change === "rotate") {
          const newDegreeRotation = (config.initial.rotate ?? 0) + e.target.valueAsNumber
          rotateElement(piece, newDegreeRotation)
        }
      }

      /**
       * @param {string} pieceId
       * @param {DirectionString[]} directions
       */
      function setDrift(pieceId, directions) {
        const piece = pieces[pieceId]
        if (!piece) {
          return
        }

        // If the dialog is closed, the element might not be visible,
        // so only animate when the piece is visible on the screen
        const element = document.getElementById(pieceId)
        if (!element || !element.checkVisibility()) {
          return
        }

        // TODO: consider toggling the direction when slider is at max
        const hDirection = horizontalDirection(directions)
        if (hDirection) {
          const hSlider = document.getElementById("slider-horizontal")
          if (hSlider && hSlider.checkVisibility()) {
            if (hDirection === "left") {
              hSlider.valueAsNumber = hSlider.valueAsNumber - SLIDER_STEP
            }
            if (hDirection === "right") {
              hSlider.valueAsNumber = hSlider.valueAsNumber + SLIDER_STEP
            }
            hSlider.dispatchEvent(new Event("input"))
            hSlider.dispatchEvent(new Event("change"))
          }
        }

        const vDirection = verticalDirection(directions)
        if (vDirection) {
          const vSlider = document.getElementById("slider-vertical")
          if (vSlider && vSlider.checkVisibility()) {
            if (vDirection === "top") {
              vSlider.valueAsNumber = vSlider.valueAsNumber - SLIDER_STEP
            }
            if (vDirection === "bottom") {
              vSlider.valueAsNumber = vSlider.valueAsNumber + SLIDER_STEP
            }
            vSlider.dispatchEvent(new Event("input"))
            vSlider.dispatchEvent(new Event("change"))
          }
        }
      }

      /**
       * @param {string} pieceId
       * @param {"reset"|undefined} type
       */
      function startDrift(pieceId, type) {
        const piece = pieces[pieceId]
        if (!piece || !piece.drift) {
          return
        }

        if (type === "reset") {
          const newDirections = []
          const hDirection = horizontalDirection(piece.direction)
          if (hDirection) {
            newDirections.push(hDirection)
          }
          const vDirection = verticalDirection(piece.direction)
          if (vDirection) {
            newDirections.push(vDirection)
          }
          driftDirection = newDirections
          driftIntervalId = setInterval(() => setDrift(selectedId, driftDirection), 250)

          return
        }

        driftIntervalId = setInterval(() => setDrift(selectedId, driftDirection), 250)
      }

      function stopDrift() {
        if (!driftIntervalId) {
          return
        }

        clearInterval(driftIntervalId)
        driftIntervalId = undefined
      }

      /** @param {string} pieceId */
      function configureSliderToPiece(pieceId) {
        const piece = pieces[pieceId]
        if (!piece) {
          return
        }

        if (piece.drift) {
          startDrift(pieceId, "reset")
        }

        const sliderH = document.getElementById("slider-horizontal")
        const directionH = horizontalDirection(piece.direction)
        if (directionH) {
          showElement(sliderH, true)
          setSliderByDirection(sliderH, directionH)
        } else {
          showElement(sliderH, false)
        }

        const sliderV = document.getElementById("slider-vertical")
        const directionV = verticalDirection(piece.direction)
        if (directionV) {
          showElement(sliderV, true)
          setSliderByDirection(sliderV, directionV)
        } else {
          showElement(sliderV, false)
        }

        const sliderR = document.getElementById("slider-rotate")
        const directionR = rotateDirection(piece.direction)
        if (directionR) {
          showElement(sliderR, true)
          setSliderByDirection(sliderR, directionR)
        } else {
          showElement(sliderR, false)
        }
      }

      /** 
       * @param {HTMLElement} slider 
       * @param {DirectionString} direction 
       */
      function setSliderByDirection(slider, direction) {
        if (!slider || !direction) {
          return
        }

        switch(direction) {
          case "left":
            return setSlider(slider, -SLIDER_MAX, 0, 0)
          case "right":
            return setSlider(slider, 0, SLIDER_MAX, 0)
          case "top":
            return setSlider(slider, -SLIDER_MAX, 0, 0)
          case "bottom":
            return setSlider(slider, 0, SLIDER_MAX, 0)
          case "rotate":
            return setSlider(slider, 0, 360, 0)
        }

      }

      /** 
       * @param {HTMLElement} slider
       * @param {number} min
       * @param {number} max
       * @param {number} value
       */
      function setSlider(slider, min, max, value) {
        if (!slider) {
          return
        }
        slider.setAttribute("min", min)
        slider.setAttribute("max", max)
        slider.value = value
      }

      /** 
       * @param {Piece} piece
       * @return {CoordinatesWithRotate}
       */
      function calculateInitialPosition(piece) {
        if (!piece) {
          return
        }
        let x = piece.target.x
        const horizontal = horizontalDirection(piece.direction)
        switch(horizontal) {
          case "left":
            // Start on the right if moving left
            x = INITIAL_X_MAX
            break
          case "right":
            // Start on the left if moving right
            x = INITIAL_X_MIN
            break
        }

        let y = piece.target.y
        const vertical = verticalDirection(piece.direction)
        switch(vertical) {
          case "top":
            // Start on the bottom if moving to top
            y = INITIAL_Y_MAX
            break
          case "bottom":
            // Start on the top if moving to bottom
            y = INITIAL_Y_MIN
            break
        }

        const coord = { x, y }
        if (rotateDirection(piece.direction)) {
          // For now, just set a random rotation since I removed all initial position spec from the file
          const randomDegree = 15 * (Math.round(Math.random() * 24))
          coord.rotate = randomDegree
        }

        return coord
      }

      /** 
       * @param {Pieces} pieces
       * @return {Pieces}
       */
      function withInitialPosition(pieces) {
        /** @type {Pieces} */
        const updated = {}
        for (const id in pieces) {
          const piece = pieces[id]
          const initial = calculateInitialPosition(piece)
          updated[id] = { ...piece, initial }
        }

        return updated
      }

      /** 
       * @param {string} pieceClass
       * @param {Pieces} piecesById
       */
      function positionPiecesWithTargets(pieceClass, piecesById) {
        const allPieces = document.querySelectorAll(pieceClass)
        allPieces.forEach(p => {
          const id = p.getAttribute("id")
          const isTargetPiece = id.includes("target")
          const pieceId = isTargetPiece ? id.replace("target_", "") : id
          if (!pieceId) {
            return
          }
          const position = piecesById[pieceId]
          if (!position) {
            return
          }

          const coord = isTargetPiece ? position.target : position.initial
          positionElement(p, coord.x, coord.y)
          if (!isTargetPiece && coord.rotate) {
            rotateElement(p, coord.rotate)
          }
          showElement(p, false)
        })
      }

      // State
      /** @type {Queue} */
      const queue =  ["24", "20", "3", "21", "16", "23", "6", "5", "25", "10", "11", "17", "9", "12", "19", "14", "13", "15", "1", "4", "2", "8", "7", "22", "18", "26"]
      /** @type {Pieces} */
      let pieces = {}
      let selectedId = ""
      /** @type {number|undefined} */
      let driftIntervalId
      /** @type {Direction} */
      let driftDirection = []

      document.addEventListener("DOMContentLoaded", () => {
        pieces = withInitialPosition(PUZZLE_CONFIG)
        selectedId = queue.shift()

        // Position each piece initially
        positionPiecesWithTargets(".puzzle-piece", pieces)

        // Show the first piece and its placeholder target
        showPieceAndTarget(selectedId)

        // Show the relevant slider and configure it to the current piece
        configureSliderToPiece(selectedId)

        // Attach event listeners to each slider
        const sliders = document.querySelectorAll(".slider")
        sliders.forEach((s) => {
          const direction = s.id.replace("slider-", "")
          s.addEventListener("input", (e) => onSliderInput(e, selectedId, direction))
          s.addEventListener("change", (e) => onSliderChange(e, selectedId, direction))
          s.addEventListener("mouseup", () => startDrift(selectedId))
          s.addEventListener("mousedown", () => stopDrift())
        })

        const verifyButton = document.getElementById("verify")
        if (verifyButton) {
          verifyButton.addEventListener("click", () => {
            window.parent.postMessage({ type: "CaptchaVerified" }, window.origin)
          })
        }
      })
    </script>
  </head>
  <body draggable="false">
    <main class="wrapper">
      <div class="instruction-container">
        <h1 class="instruction">Slide the piece to finish the puzzle</h1>
      </div>
      <div class="puzzle-wrapper">
