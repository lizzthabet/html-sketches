<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mirror</title>
    <style>
      html {
        background-color: midnightblue;
        color: ghostwhite;
        cursor: none;
        font-size: 20px;
        margin: 25px;
        overflow: hidden;
      }

      .wall {
        margin-top: 45%;
        display: flex;
        justify-content: center;
      }

      .mirror {
        background: linear-gradient(32deg, dimgray 0%, gray 28%, ghostwhite 63%, dimgray 100%);
        border: 1px solid gray;
        border-radius: 75px 75px 0 0;
        height: 300px;
        margin: 0;
        position: relative;
        width: 175px;
        z-index: 2;
      }

      .once {
        height: 35px;
        width: 35px;
        opacity: 0.2;
        user-select: none;
        z-index: 1;
      }

      .cursor {
        height: 35px;
        position: absolute;
        width: 35px;
        z-index: 3;
      }

      .ghost {
        font-size: 1rem;
        margin: 0;
        padding: calc(35px / 2);
        position: absolute;
        text-shadow: 0px 0px 5px white;
        z-index: 4;
      }

      .emerging {
        opacity: 0;
      }

      .floating {
        animation: floating 6s infinite linear, appear 2s 1 ease-in;
        offset-path: path("m 6,1 c-11.24,2.19,-1.45,14.63,6.56,14.5 c8.88,-0.83,13.17,-0.31,17.65,2.13 c6.43,4.22,9.94,11.65,0.98,18.58 c-9.53,4.82,-18.72,2.11,-19.77,-7.51 c0.3,-12.41,10.09,-10.17,5.77,-23.02 c-1.92,-4.04,-7,-5.87,-11.18,-4.68 z");
        offset-rotate: 0deg;
      }

      @keyframes floating {
        0% {
          offset-distance: 0%;
        }

        100% {
          offset-distance: 100%;
        }
      }

      @keyframes appear {
        0% {
          opacity: 0;
        }

        100% {
          opacity: 1;
        }
      }
    </style>
    <script>
      const MOUSE_TRACE = "MouseTrace"
      const MOUSE_MOVE = "MouseMove"
      const MOUSE_ENTER = "MouseEnter"
      const MOUSE_LEAVE = "MouseLeave"
      const GHOST_APPEAR = "GhostAppear"
      const GHOST_EMERGE = "GhostEmerge"
      const GHOST_EVADE = "GhostEvade"

      function place(element, x, y) {
        if (!element) {
          return
        }

        element.style.setProperty("top", y + "px")
        element.style.setProperty("left", x + "px")
      }

      function initialize(_e) {
        window.parent.postMessage({
          type: GHOST_APPEAR,
        })

        document.removeEventListener("mousemove", initialize)
      }

      function apparition(ghost) {
        if (ghost) {
          ghost.style.setProperty("top", "45vh")
          ghost.style.setProperty("left", "45vw")
          ghost.classList.remove("emerging")
          ghost.classList.add("floating")
        }
      }

      function evade(element, x, y) {
        const { top, left, right, bottom } = ghost.getBoundingClientRect()
        const xOnGhost = x >= left && x <= right
        const yOnGhost = y >= top && y <= bottom
        if (xOnGhost && yOnGhost) {
          // TODO: Instead of implicitly relying on the imported script, emit an event instead
          requestAnimationFrame(() => {
            if (ghost.classList.contains("floating")) {
              ghost.classList.remove("floating")
            }
            onMouseMove(
              new MouseEvent("MouseMove", { clientX: x, clientY: y }),
              element,
            )
          })

          // See if the ghost has moved on from this plane to the next
          const {
            top: newTop,
            left: newLeft,
            right: newRight,
            bottom: newBottom,
            height,
            width
          } = ghost.getBoundingClientRect()
          const { innerHeight, innerWidth } = window;

          const halfWidth = 0.5 * width
          const halfHeight = 0.5 * height
          const xCenter = newLeft + halfWidth
          const yCenter = newTop + halfHeight
          const isOutsideFrame = yCenter <= 0 || yCenter >= innerHeight || xCenter <= 0 || xCenter >= innerWidth
          if (isOutsideFrame) {
            const mirrorX = mirror(xCenter, 0, innerWidth) - halfWidth
            const mirrorY = mirror(yCenter, 0, innerHeight) - halfHeight
            window.parent.postMessage({
              type: GHOST_EMERGE,
              x: mirrorX,
              y: mirrorY,
            })
          }
        }
      }

      /**
       * Mirror flips a coordinate `n` when it exceeds a minimum or maximum range;
       * eg. when n = -5, min = 0, max = 100, then n is flipped to 95, or
       * when n = 110 (with the same min max), then n is flipped to 10.
       * For this use, `n` will be the middle point of an element, and it'll
       * be translated back to (left, top) coordinates after mirroring.
       */
      function mirror(n, min, max) {
        if (n <= min) {
          return max - Math.abs(min - n)
        }

        if (n >= max) {
          return min + Math.abs(n - max)
        }

        return n
      }

      function area(x1, y1, x2, y2, x3, y3) {
        return Math.abs(x1 * (y2 - y3) + x2 * (y3 - y1) + x3 * (y1 - y2)) / 2
      }

      function pointInTriangle(p1, p2, x1, y1, x2, y2, x3, y3) {
        const triangleArea = area(x1, y1, x2, y2, x3, y3)
        const a1 = area(p1, p2, x2, y2, x3, y3)
        const a2 = area(x1, y1, p1, p2, x3, y3)
        const a3 = area(x1, y1, x2, y2, p1, p2)
        return triangleArea === (a1 + a2 + a3)
      }

      function overlaps(mirror, x, y) {
        if (!mirror) {
          return false
        }
        const { top, left, right, bottom } = mirror.getBoundingClientRect()

        // Imprecise math that considers the two top rounded corners of the mirror
        // as triangles and ignores mouse coordinates within those triangles
        if (y >= top && y <= top + 75) {
          // Check overlap with left corner
          const leftRadius = 75 // Based on border radius
          if (x >= left && x <= left + leftRadius) {
            const mouseInRoundedCorner = pointInTriangle(x, y, left, top, left + leftRadius, top, left, top + leftRadius)
            if (mouseInRoundedCorner) {
              return false
            }
          }
          // Check overlap with right corner
          const rightRadius = 60 // Extremely fuzzy math to account for cursor width
          if (x >= right - rightRadius && x <= right) {
            const mouseInRoundedCorner = pointInTriangle(x, y, right, top, right - rightRadius, top, right, top + rightRadius)
            if (mouseInRoundedCorner) {
              return false
            }
          }
        }

        const xOverlaps = x >= left && x <= right
        const yOverlaps = y >= top && y <= bottom
        return xOverlaps && yOverlaps
      }

      function leaveCursor(x, y) {
        const element = document.createElement("img")
        element.setAttribute("src", "../assets/normal.cur")
        element.classList.add("once")
        element.style.setProperty("position", "absolute")
        place(element, x + 3, y - 3)
        return element
      }

      function mark(e) {
        const { pageX, pageY } = e
        const x = leaveCursor(pageX, pageY)
        document.body.appendChild(x)
      }

      function trace(e) {
        window.parent.postMessage({
          type: MOUSE_TRACE,
          x: e.pageX,
          y: e.pageY,
        })
      }

      function waitByTime(action, time) {
        let ignore = null
        return (toActOn) => {
          if (ignore) {
            clearTimeout(ignore)
          }
          ignore = setTimeout(() => action(toActOn), time)
        }
      }

      function show(element, show) {
        if (!element) {
          return
        }
        const display = element.style.getPropertyValue("display")
        if (!show && display !== "none") {
          element.style.setProperty("display", "none")
        }
        if (show && display === "none") {
          element.style.removeProperty("display")
        }
      }

      const hauntOverThere = waitByTime(trace, 100)
      document.addEventListener("DOMContentLoaded", () => {
        const mirror = document.getElementById("mirror")
        const warped = document.getElementById("warped")
        const ghost = document.getElementById("ghost")

        window.addEventListener("message", (e) => {
          if (e.origin !== window.origin || !e.data) {
            return
          }

          if (e.data.type === MOUSE_TRACE) {
            const x = leaveCursor(e.data.x, e.data.y)
            document.body.appendChild(x)
          }

          if (e.data.type === MOUSE_MOVE) {
            place(warped, e.data.x, e.data.y)
          }

          if (e.data.type === MOUSE_ENTER) {
            show(warped, true)
          }

          if (e.data.type === MOUSE_LEAVE) {
            show(warped, false)
          }

          if (e.data.type === GHOST_APPEAR) {
            setTimeout(() => {
              apparition(ghost)
            }, 1000)
          }

          if (e.data.type === GHOST_EMERGE) {
            if (ghost) {
              ghost.classList.remove("emerging")
              ghost.classList.remove("floating")
            }
            place(ghost, e.data.x, e.data.y)
          }

          if (e.data.type === GHOST_EVADE) {
            evade(ghost, e.data.x, e.data.y)
          }
        })

        document.addEventListener("mousemove", initialize)

        document.addEventListener("mousemove", (e) => { 
          // Send all mouse events to the other window,
          // since only that window knows when the ghost
          // will flutter
          window.parent.postMessage({
            type: GHOST_EVADE,
            x: e.pageX,
            y: e.pageY,
          })
        })

        // Use mouse coordinates, rather than listening to mouse events
        // on specific elements, to determine which events should fire.
        let lastPositionOverMirror = false
        document.addEventListener("mousemove", (e) => {
          if (!mirror) {
            return
          }

          const midpointX = e.pageX + 35 / 2
          const midpointY = e.pageY + 35 / 2
          const overMirror = overlaps(mirror, midpointX, midpointY)
          // const overMirror = overlaps(mirror, e.pageX, e.pageY)
          if (overMirror && !lastPositionOverMirror) {
            window.parent.postMessage({
              type: MOUSE_ENTER,
            })
          }

          if (!overMirror && lastPositionOverMirror) {
            window.parent.postMessage({
              type: MOUSE_LEAVE,
            })
          }

          if (overMirror) {
            lastPositionOverMirror = true
            window.parent.postMessage({
              type: MOUSE_MOVE,
              x: e.pageX,
              y: e.pageY,
            })
          } else {
            lastPositionOverMirror = false
            hauntOverThere(e)
          }
        })
      })
    </script>
  </head>
  <body>
    <main class="wall">
      <figure id="mirror" class="mirror"></figure>
      <img id="warped" class="cursor" style="display:none;" src="../assets/wavy.cur" aria-label="reflected cursor"/>
      <figure id="ghost" class="ghost emerging" style="top: -10vh; left: -10vw;">👻</figure>
    </main>
    <!-- if you stay somewhere long enough, you can almost see yourself -->
    <!-- you can see yourself once you stop moving -->
    <!-- some mouse dandriff you create -->
    <!-- it's disorienting not to point -->
     <script src="../evasive-elements.js" defer></script>
  </body>
</html>
