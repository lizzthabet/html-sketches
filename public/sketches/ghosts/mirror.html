<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mouse dandruff (or, a haunting?)</title>
    <style>
      html {
        background-color: midnightblue;
        color: ghostwhite;
        cursor: none;
        font-size: 20px;
        margin: 25px;
      }

      .wall {
        margin-top: 45%;
        display: flex;
        justify-content: center;
      }

      .mirror {
        background: linear-gradient(32deg, dimgray 0%, gray 28%, ghostwhite 63%, dimgray 100%);
        border-radius: 75px 75px 0 0;
        cursor: url('assets/wavy.cur'), default;
        height: 300px;
        margin: 0;
        width: 175px;
      }

      .once {
        height: 35px;
        width: 35px;
        opacity: 0.2;
        user-select: none;
      }
    </style>
    <script>
      const MOUSE_MOVE = "MouseMove"
      const MOUSE_TRACE = "MouseTrace"
      const DO_NOT_HAUNT = ["mirror"]

      function leaveCursor(x, y) {
        const element = document.createElement("img")
        element.setAttribute("src", "assets/normal.cur")
        element.classList.add("once")
        element.style.setProperty("position", "absolute")
        element.style.setProperty("top", y - 3 + "px")
        element.style.setProperty("left", x + 3 + "px")
        return element
      }

      function toMark(e) {
        const { pageX, pageY } = e
        const x = leaveCursor(pageX, pageY)
        document.body.appendChild(x)
      }

      function toPublish(e) {
        window.parent.postMessage({
          type: MOUSE_MOVE,
          x: e.pageX,
          y: e.pageY,
        })
      }

      function waitByVolume(action, volume) {
        let count = 0
        return (toActOn) => {
          count++
          if (count === volume) {
            count = 0
            action(toActOn)
          }
        }
      }

      function waitByTime(action, time) {
        let ignore = null
        return (toActOn) => {
          if (ignore) {
            clearTimeout(ignore)
          }
          ignore = setTimeout(() => action(toActOn), time)
        }
      }

      function show(reference, show) {
        const target = document.querySelector(reference)
        if (!target) {
          return
        }
        const display = target.style.getPropertyValue("display")
        if (!show && display !== "none") {
          target.style.setProperty("display", "none")
        }
        if (show && display === "none") {
          target.style.removeProperty("display")
        }
      }

      const hauntOverThere = waitByTime(toPublish, 100)
      const haunted = waitByTime(toMark, 100)
      const haunting = waitByVolume(toMark, 60)
      document.addEventListener("DOMContentLoaded", () => {
        // TODO: Try saving the location of each item
        // that shouldn't be haunted and check the mouse
        // coordinates
        // const DO_NOT_HAUNT_IN = {}
        // DO_NOT_HAUNT.forEach((id) => {})

        // TODO: Add a "mousemove" event listener to the "mirror" element
        // that sends the cursor position with an event to the parent window

        // Also add an event for "mouseleave" and "mouseenter"
        // to manage the cursor's visibility in the other window

        window.addEventListener("message", (e) => {
          if (e.origin !== window.origin || !e.data) {
            return
          }

          // TODO: Add more event payload validation
          if (e.data.type === MOUSE_TRACE) {
            const x = leaveCursor(e.data.x, e.data.y)
            document.body.appendChild(x)
          }

        })

        document.addEventListener("mousemove", (e) => {
          // console.log("mousemove", e.target)
          e.stopPropagation()
          const identifier = e.target.getAttribute("id") ?? ""
          if (DO_NOT_HAUNT.includes(identifier)) {
            return
          }
          hauntOverThere(e)
        })
      })
    </script>
  </head>
  <body>
    <main class="wall">
      <figure id="mirror" class="mirror"></figure>
    </main>
    <!-- if you stay somewhere long enough, you can almost see yourself -->
    <!-- you can see yourself once you stop moving -->
    <!-- some mouse dandriff you create -->
    <!-- it's disorienting not to point -->
  </body>
</html>
