<!DOCTYPE html>
<html lang="en">
  <head>
    <title>doors to mirrors</title>
    <style>
      html {
        background-color: rgb(16, 16, 67);
      }

      body {
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
        justify-content: space-evenly;
        text-align: center;
      }

      iframe.door-frame {
        margin-top: max(2rem, calc(50vh - 325px));
        height: 650px;
        width: 325px;
      }

      /* TODO: Make shadows or light beams from the doorway */

      .door-frame + .door-frame {
        margin-left: 2rem;
      }
    </style>
    <script>
      const MOUSE_TRACE = "MouseTrace"
      const MOUSE_MOVE = "MouseMove"
      const MOUSE_ENTER = "MouseEnter"
      const MOUSE_LEAVE = "MouseLeave"

      function sendEvent(receiver, payload) {
        receiver.contentWindow.postMessage(payload)
      }

      document.addEventListener("DOMContentLoaded", () => {
        const frameOne = document.getElementById("one")
        const frameTwo = document.getElementById("two")

        const sourceToReceiver = {
          one: frameTwo,
          two: frameOne,
        }

        window.addEventListener("message", (e) => {
          if (e.origin !== window.origin || !e.data) {
            return
          }

          const receiver = e.source ? sourceToReceiver[e.source.name] : undefined
          // Don't process events for unnamed sources,
          // since the sender determines the receiver
          if (!receiver) {
            return
          }

          // Proxy events from one window to the other;
          // TODO: Add much event payload validation
          switch(e.data.type) {
            case MOUSE_TRACE:
              sendEvent(receiver, { type: MOUSE_TRACE, x: e.data.x, y: e.data.y })
              return
            case MOUSE_MOVE:
              sendEvent(receiver, { type: MOUSE_MOVE, x: e.data.x, y: e.data.y })
              return
            case MOUSE_LEAVE:
              sendEvent(receiver, { type: MOUSE_LEAVE })
              return
            case MOUSE_ENTER:
              sendEvent(receiver, { type: MOUSE_ENTER })
              return
          }
        })
      })

    </script>
  </head>
  <body>
    <iframe id="one" name="one" class="door-frame" title="door frame to mirror" src="mirror.html"></iframe>
    <iframe id="two" name="two" class="door-frame" title="door frame to mirror" src="mirror.html"></iframe>
  </body>
</html>
