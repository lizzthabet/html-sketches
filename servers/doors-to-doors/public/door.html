<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>doors to doors</title>
    <style>
      html {
        height: 100%;
        width: 100%;
        background-color: midnightblue;
      }
      body {
        padding: 0;
        margin: 0;
        height: 100%;
        width: 100%;
      }
      main {
        position: relative;
        top: 50%;
        text-align: center;
      }
      a, a:visited {
        color: white;
        font-size: 1.5rem;
        text-decoration: none;
      }
    </style>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const link = document.querySelector("a")
        // hack to generate infinitely nesting iframes
        const now = new Date().getMilliseconds()
        link.setAttribute("href", `room.html?key=${now}`)
      })
    </script>
  </head>
  <body>
    <main class="main">
      <a href="room.html">open</a>
    </main>
  </body>
</html>
